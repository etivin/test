<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Racer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 0 16px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  canvas { display: block; width: 800px; max-width: 100%; height: auto; border-radius: 10px;
    background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.6); touch-action: none; }
  p { margin: 0; color: #aab; font-size: 14px; text-align: center; line-height: 1.6; }
  .pu { display: inline-block; padding: 0 8px; border-radius: 99px; font-weight: 600; color: #fff; }
</style>
</head>
<body>
<h1>Road Racer</h1>
<canvas id="game" width="800" height="500"></canvas>
<p>← → steer &nbsp;·&nbsp; ↑ gas &nbsp;·&nbsp; ↓ brake &nbsp;·&nbsp; Space to start / restart &nbsp;·&nbsp; (WASD and touch work too)<br>
  <span class="pu" style="background:#e8680c">⚡ Nitro</span> speed boost &nbsp;
  <span class="pu" style="background:#1e8fc9">🛡 Shield</span> smash through traffic &nbsp;
  <span class="pu" style="background:#8a3fd6">×2</span> double points &nbsp;
  <span class="pu" style="background:#c99a06">● Coins</span> bonus points</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// Older browsers (e.g. Chrome < 99, Safari < 16) don't have roundRect
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(Math.abs(+r || 0), Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}
const W = canvas.width, H = canvas.height;

// ---------- World / camera constants ----------
const SEG = 200, RUMBLE = 3, ROAD_W = 2000, LANES = 3;
const CAM_H = 1000, CAM_D = 1 / Math.tan(50 * Math.PI / 180); // 100° field of view
const DRAW_DIST = 300, PLAYER_Z = CAM_H * CAM_D;
const HORIZON = H / 2 + 4;
const MAX_SPEED = SEG * 60, ACCEL = MAX_SPEED / 5, BRAKE = MAX_SPEED, DECEL = MAX_SPEED / 5;
const OFF_DECEL = MAX_SPEED / 2, OFF_LIMIT = MAX_SPEED / 4, CENTRIFUGAL = 0.3;
const NITRO_MULT = 1.5;
const LANE_X = [-2 / 3, 0, 2 / 3];
const CYCLE = 1800000; // distance for a full day -> sunset -> night -> dawn cycle
const POW_TIME = { nitro: 4, shield: 6, double: 10 };

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (h, f) => rgb(f < 0 ? mix(hex(h), [0, 0, 0], -f) : mix(hex(h), [255, 255, 255], f));

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, r)); ctx.fill(); }
function quad(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}

// ---------- Scenery definitions ----------
const BIOMES = [
  { grass: ['#43a047', '#3b8f3f'], road: ['#6d6f73', '#66686c'], dust: '#7a6a45',
    sprites: ['pine', 'oak', 'oak', 'bush', 'pine'] },
  { grass: ['#e2c07c', '#d6b46e'], road: ['#7b746c', '#746d65'], dust: '#d9b56f',
    sprites: ['palm', 'cactus', 'cactus', 'rock', 'palm'] },
  { grass: ['#eef3f8', '#dde6ef'], road: ['#5f636a', '#595d64'], dust: '#ffffff',
    sprites: ['snowpine', 'snowpine', 'rock', 'snowman', 'snowpine'] },
];
const SPRITES = {
  pine: { w: 700, h: 1500 }, snowpine: { w: 700, h: 1500 }, oak: { w: 1000, h: 1300 },
  bush: { w: 650, h: 380 }, palm: { w: 1000, h: 1700 }, cactus: { w: 450, h: 850 },
  rock: { w: 700, h: 420 }, snowman: { w: 420, h: 760 }, lamp: { w: 160, h: 1400 },
  billboard: { w: 1500, h: 1150 },
};
const BILLBOARDS = ['ROAD RACER', 'GRAB NITRO', 'DRIVE FAST', 'SHIELDS UP', 'x2 POINTS', 'NO BRAKES'];
const BOARD_COLORS = ['#e53935', '#1e88e5', '#8e24aa', '#f57c00', '#00897b'];

const CAR_TYPES = [
  { kind: 'car', w: 420, h: 230, speed: [0.35, 0.6],
    colors: ['#3fa9f5', '#f5a623', '#7ed321', '#bd10e0', '#f8e71c', '#eeeeee', '#34495e'] },
  { kind: 'van', w: 460, h: 390, speed: [0.3, 0.5], colors: ['#ecf0f1', '#95a5a6', '#2980b9', '#16a085'] },
  { kind: 'truck', w: 520, h: 600, speed: [0.25, 0.4], colors: ['#c0392b', '#8e44ad', '#27ae60', '#e67e22'] },
];
const PLAYER = { kind: 'car', w: 440, h: 210, color: '#e53935',
  dark: shade('#e53935', -0.4), light: shade('#e53935', 0.3) };
const PK = (CAM_D / PLAYER_Z) * W / 2; // pixels per world unit at the player's depth
const PW = PLAYER.w * PK, PH = PLAYER.h * PK;

const POWER = {
  nitro: { col: '#ff8a1f', deep: '#b34700', glow: '255,140,40', label: 'NITRO' },
  shield: { col: '#39c0ff', deep: '#0b5f94', glow: '80,200,255', label: 'SHIELD' },
  double: { col: '#bb66ff', deep: '#5a1e99', glow: '190,110,255', label: '2X SCORE' },
};

// Sky palettes for the time-of-day cycle
const KF = [
  { top: '#2e7fd9', bottom: '#bfe2ff', fog: '#cfe8fb', far: '#7d9fc4', near: '#5a8a6a', cloud: '#ffffff', sun: '#fff4c2', sunY: 0.75, dark: 0, stars: 0 },
  { top: '#2c2466', bottom: '#ff9166', fog: '#f0a582', far: '#6d4a78', near: '#3f3050', cloud: '#ffb199', sun: '#ffd27a', sunY: 0.1, dark: 0.15, stars: 0.15 },
  { top: '#04071a', bottom: '#1d2a5c', fog: '#1a2450', far: '#1d2447', near: '#111831', cloud: '#39406b', sun: '#ffd27a', sunY: -0.4, dark: 0.5, stars: 1 },
  { top: '#4b6cb7', bottom: '#ffd1b3', fog: '#f3d6c4', far: '#8c90b8', near: '#5d7563', cloud: '#ffe0d0', sun: '#ffe1a8', sunY: 0.15, dark: 0.08, stars: 0.25 },
].map(k => { const o = {}; for (const key in k) o[key] = typeof k[key] === 'string' ? hex(k[key]) : k[key]; return o; });

// ---------- Track ----------
let segments = [], trackLength = 0;
const ease = {
  in: (a, b, p) => a + (b - a) * p * p,
  out: (a, b, p) => a + (b - a) * (1 - (1 - p) * (1 - p)),
  inOut: (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5),
};
const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;

function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n, curve, sprites: [], clip: H, fog: 0,
    biome: BIOMES[Math.floor(n / 900) % BIOMES.length],
    dark: Math.floor(n / RUMBLE) % 2 === 1,
    p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { y, z: (n + 1) * SEG }, camera: {}, screen: {} },
  });
}

function addRoad(enter, hold, leave, curve, height) {
  const startY = lastY(), endY = startY + height * SEG, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(ease.in(0, curve, n / enter), ease.inOut(startY, endY, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, ease.inOut(startY, endY, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(ease.out(curve, 0, n / leave), ease.inOut(startY, endY, (enter + hold + n) / total));
}

function buildTrack() {
  segments = [];
  addRoad(30, 30, 30, 0, 0);
  for (let i = 0; i < 30; i++) {
    const len = pick([20, 35, 50]);
    const curve = pick([-6, -4, -2, 0, 2, 4, 6]);
    let hill = pick([0, 15, 30, 45]) * (Math.random() < 0.5 ? -1 : 1);
    if (Math.abs(lastY() + hill * SEG) > 12000) hill = -hill; // keep elevation in check
    if (Math.random() < 0.2) { // S-bend
      addRoad(len, len, len, -curve || -3, hill / 2);
      addRoad(len, len, len, curve || 3, hill / 2);
    } else addRoad(len, len, len, curve, hill);
  }
  addRoad(60, 60, 60, 0, -lastY() / SEG); // come back down so the loop joins up
  addRoad(30, 30, 30, 0, 0);
  segments[segments.length - 1].p2.world.y = 0;
  trackLength = segments.length * SEG;

  for (const seg of segments) {
    const n = seg.index;
    if (n < 15) continue;
    if (n % 30 === 0) {
      seg.sprites.push({ type: 'lamp', offset: -1.12, side: 1 }, { type: 'lamp', offset: 1.12, side: -1 });
    }
    if (n % 140 === 70) seg.sprites.push({ type: 'billboard', offset: pick([-1.6, 1.6]),
      text: pick(BILLBOARDS), color: pick(BOARD_COLORS) });
    if (Math.random() < 0.45) seg.sprites.push({ type: pick(seg.biome.sprites), offset: pick([-1, 1]) * rand(1.35, 3.2) });
    if (Math.random() < 0.15) seg.sprites.push({ type: pick(seg.biome.sprites), offset: pick([-1, 1]) * rand(3.2, 6) });
  }
}

const findSeg = z => segments[Math.floor(z / SEG) % segments.length];
function rel(z, from) { // signed distance along the looping track
  let d = (z - from) % trackLength;
  if (d < 0) d += trackLength;
  return d > trackLength / 2 ? d - trackLength : d;
}

// ---------- Background layers ----------
function makeRange(P, parts) {
  const phase = parts.map(() => Math.random() * Math.PI * 2);
  const h = new Float32Array(P);
  let min = Infinity;
  for (let i = 0; i < P; i++) {
    let v = 0;
    parts.forEach(([a, f], j) => { v += a * Math.sin(2 * Math.PI * f * i / P + phase[j]); });
    h[i] = v; min = Math.min(min, v);
  }
  for (let i = 0; i < P; i++) h[i] -= min;
  return h;
}
const RANGE_P = 1600;
const FAR = makeRange(RANGE_P, [[40, 2], [25, 5], [12, 11], [6, 23], [3, 47]]);
const NEAR = makeRange(RANGE_P, [[16, 3], [9, 7], [4, 13], [2, 31]]);
const STARS = Array.from({ length: 140 }, () => ({ x: rand(0, W), y: rand(0, HORIZON * 0.85),
  r: Math.random() < 0.15 ? 2 : 1, tw: rand(1, 4), ph: rand(0, 6) }));
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: i * 170 + rand(0, 80), y: rand(40, HORIZON - 110), s: rand(0.6, 1.3) }));
const VIGNETTE = (() => {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.7);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  return g;
})();

// ---------- Game state ----------
const input = { left: false, right: false, up: false, down: false };
let state = 'start', position = 0, playerX = 0, playerY = 0, speed = 0, traveled = 0, score = 0, best = 0;
let cars = [], items = [], particles = [], popups = [], lights = [];
let carTimer = 0, itemTimer = 0, shake = 0, time = 0, tilt = 0, crashTime = 0, newBest = false;
let nitro = 0, shield = 0, double = 0, bgFar = 0, bgNear = 0, bgCloud = 0;
try { best = +localStorage.getItem('roadRacerBest') || 0; } catch (e) {}

function reset() {
  position = 0; playerX = 0; speed = MAX_SPEED * 0.25; traveled = 0; score = 0;
  cars = []; items = []; particles = []; popups = [];
  carTimer = 6000; itemTimer = 3000; nitro = shield = double = 0; shake = 0; newBest = false;
}

function start() {
  if (state === 'over' && time - crashTime < 0.8) return;
  reset();
  state = 'playing';
}

// ---------- Spawning ----------
function spawnCar(pz) {
  const z = (pz + rand(52000, 57000)) % trackLength;
  const lane = Math.floor(Math.random() * LANES);
  const near = cars.filter(c => Math.abs(rel(c.z, z)) < 2500);
  // Never block every lane at once
  if (near.some(c => c.lane === lane) || new Set(near.map(c => c.lane)).size >= LANES - 1) return;
  const r = Math.random();
  const T = r < 0.6 ? CAR_TYPES[0] : r < 0.85 ? CAR_TYPES[1] : CAR_TYPES[2];
  const color = pick(T.colors);
  const base = MAX_SPEED * rand(T.speed[0], T.speed[1]);
  cars.push({ kind: T.kind, w: T.w, h: T.h, lane, offset: LANE_X[lane] + rand(-0.05, 0.05), z, base, speed: base,
    color, dark: shade(color, -0.35), light: shade(color, 0.25), passed: false, dead: false });
}

function spawnItems(pz) {
  const z = pz + rand(50000, 56000);
  const lane = Math.floor(Math.random() * LANES);
  if (Math.random() < 0.62) {
    for (let i = 0; i < 6; i++) items.push({ type: 'coin', z: (z + i * 500) % trackLength, offset: LANE_X[lane] });
  } else {
    items.push({ type: pick(['nitro', 'shield', 'double']), z: z % trackLength, offset: LANE_X[lane] });
  }
}

function burst(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(o.speed * 0.3, o.speed);
    const life = rand(o.life * 0.6, o.life);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + (o.up || 0), life, max: life,
      size: rand(o.size * 0.5, o.size), color: pick(o.colors), g: o.g || 0, grow: o.grow || 0, add: !!o.add });
  }
}

function popup(text, color, size = 26) {
  popups.push({ text, color, size, x: W / 2 + rand(-40, 40), y: H - 150, life: 1.2 });
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  const playing = state === 'playing';
  const pSeg = findSeg(position + PLAYER_Z);
  const speedPct = speed / MAX_SPEED;
  const move = speed * dt;
  position = (position + move) % trackLength;
  traveled += move;

  if (playing) {
    score += move / 200 * (double > 0 ? 2 : 1);
    const steer = dt * 2 * Math.min(1, speedPct);
    if (input.left) playerX -= steer;
    if (input.right) playerX += steer;
    playerX -= steer * speedPct * pSeg.curve * CENTRIFUGAL;
    tilt = lerp(tilt, (input.right ? 1 : 0) - (input.left ? 1 : 0), Math.min(1, dt * 8));

    const top = nitro > 0 ? MAX_SPEED * NITRO_MULT : MAX_SPEED;
    if (nitro > 0) speed += ACCEL * 2 * dt;
    else if (input.up) speed += ACCEL * dt;
    else if (input.down) speed -= BRAKE * dt;
    else speed -= DECEL * dt;
    if (speed > top) speed = nitro > 0 ? top : Math.max(top, speed - DECEL * 2 * dt);

    if (Math.abs(playerX) > 1) {
      if (speed > OFF_LIMIT) speed -= OFF_DECEL * dt;
      if (speed > 500 && Math.random() < 0.7) {
        burst(W / 2 + rand(-PW / 2, PW / 2), H - 12, 1, { speed: 60, life: 0.6, size: 7, colors: [pSeg.biome.dust], up: 40, grow: 1.5 });
      }
      for (const s of pSeg.sprites) {
        const sw = SPRITES[s.type].w;
        if (Math.abs(playerX - s.offset) < (PLAYER.w + sw * 0.5) / 2 / ROAD_W && speed > OFF_LIMIT * 0.6) {
          speed = OFF_LIMIT * 0.4;
          shake = 10;
          burst(W / 2, H - 60, 14, { speed: 220, life: 0.6, size: 6, colors: ['#8d6e63', '#bbb', pSeg.biome.dust], g: 500 });
          popup('BUMP!', '#ffcc80', 22);
          break;
        }
      }
    }
    playerX = clamp(playerX, -2.5, 2.5);
    speed = clamp(speed, 0, MAX_SPEED * NITRO_MULT);

    nitro = Math.max(0, nitro - dt);
    shield = Math.max(0, shield - dt);
    double = Math.max(0, double - dt);

    // exhaust smoke / nitro flames
    if (Math.random() < 0.5 || nitro > 0) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const x = W / 2 + side * PW * 0.22, y = H - 14 - PH * 0.14;
      if (nitro > 0) burst(x, y, 2, { speed: 60, life: 0.3, size: 7, colors: ['#ffd54f', '#ff8a1f', '#6ec6ff'], up: 160, add: true });
      else burst(x, y, 1, { speed: 20, life: 0.5, size: 5, colors: ['#b0b4bc'], up: 50, grow: 2 });
    }
  } else if (state === 'over') {
    speed = Math.max(0, speed - MAX_SPEED * 1.2 * dt);
    tilt = lerp(tilt, 0, Math.min(1, dt * 4));
    if (Math.random() < 0.4) burst(W / 2 + rand(-30, 30), H - 70, 1, { speed: 25, life: 1.4, size: 10, colors: ['#555', '#777', '#444'], up: -70, grow: 2.5 });
  } else {
    speed = MAX_SPEED * 0.45; // attract mode behind the title screen
  }

  bgFar += pSeg.curve * speedPct * dt * 25;
  bgNear += pSeg.curve * speedPct * dt * 50;
  bgCloud += pSeg.curve * speedPct * dt * 12 + dt * 6;

  updateTraffic(dt, playing);
  updateItems(dt, playing);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 30);
}

function updateTraffic(dt, playing) {
  const pz = (position + PLAYER_Z) % trackLength;
  for (const c of cars) {
    if (c.dead) {
      c.offset += c.vx * dt; c.vy -= 5000 * dt; c.lift = Math.max(0, c.lift + c.vy * dt);
      c.rot += c.vx * dt * 1.5; c.fly += dt; c.z = (c.z + speed * 1.02 * dt) % trackLength;
      continue;
    }
    c.speed = c.base;
    for (const o of cars) { // don't drive through the car ahead in your lane
      if (o !== c && !o.dead && o.lane === c.lane) {
        const d = rel(o.z, c.z);
        if (d > 0 && d < 900) c.speed = Math.min(c.speed, o.speed);
      }
    }
    if (rel(c.z, pz) < 0 && playing) c.speed = Math.min(c.speed, speed * 0.9); // don't rear-end the player
    c.z = (c.z + c.speed * dt) % trackLength;
  }
  cars = cars.filter(c => rel(c.z, pz) > -2500 && !(c.dead && c.fly > 1.2));
  if (!playing) return;

  carTimer -= speed * dt;
  if (carTimer <= 0) {
    spawnCar(pz);
    carTimer = Math.max(2000, 6500 - traveled / 180) * rand(0.7, 1.3);
  }

  for (const c of cars) {
    if (c.dead) continue;
    const d = rel(c.z, pz), gap = Math.abs(c.offset - playerX), hitW = (c.w + PLAYER.w) / 2 / ROAD_W * 0.85;
    if (d > -120 && d < 260 && gap < hitW) {
      if (shield > 0) smash(c);
      else { crash(); return; }
    } else if (!c.passed && d <= -120) {
      c.passed = true;
      if (gap < hitW + 0.18) { addScore(25); popup('CLOSE CALL +' + 25 * (double > 0 ? 2 : 1), '#fff176', 20); }
    }
  }
}

function updateItems(dt, playing) {
  const pz = (position + PLAYER_Z) % trackLength;
  if (playing) {
    itemTimer -= speed * dt;
    if (itemTimer <= 0) { spawnItems(pz); itemTimer = rand(7000, 14000); }
    for (const it of items) {
      const d = rel(it.z, pz);
      if (!it.taken && d > -150 && d < 200 && Math.abs(it.offset - playerX) < 0.28) collect(it);
    }
  }
  items = items.filter(it => !it.taken && rel(it.z, pz) > -1000);
}

function addScore(n) { score += n * (double > 0 ? 2 : 1); }

function collect(it) {
  it.taken = true;
  if (it.type === 'coin') {
    addScore(50);
    popup('+' + 50 * (double > 0 ? 2 : 1), '#ffd54f', 22);
    burst(W / 2, H - 90, 10, { speed: 180, life: 0.5, size: 4, colors: ['#ffd54f', '#fff3c4'], add: true });
    return;
  }
  if (it.type === 'nitro') { nitro = POW_TIME.nitro; shake = 5; }
  if (it.type === 'shield') shield = POW_TIME.shield;
  if (it.type === 'double') double = POW_TIME.double;
  popup(POWER[it.type].label + '!', POWER[it.type].col, 34);
  burst(W / 2, H - 90, 30, { speed: 300, life: 0.7, size: 5, colors: [POWER[it.type].col, '#ffffff'], add: true });
}

function smash(c) {
  c.dead = true; c.fly = 0; c.lift = 0; c.vy = 1800; c.rot = 0;
  c.vx = (c.offset >= playerX ? 1 : -1) * rand(2, 3);
  addScore(150);
  popup('SMASH +' + 150 * (double > 0 ? 2 : 1), '#80d8ff', 28);
  shake = 12; speed *= 0.9;
  burst(W / 2, H - 100, 30, { speed: 420, life: 0.6, size: 5, colors: ['#fff59d', '#ffb74d', '#80d8ff', c.color], g: 600, add: true });
}

function crash() {
  state = 'over'; crashTime = time; shake = 24;
  burst(W / 2, H - 70, 45, { speed: 480, life: 0.8, size: 6, colors: ['#fff59d', '#ffb74d', '#ff7043'], g: 700, add: true });
  burst(W / 2, H - 70, 25, { speed: 120, life: 1.6, size: 14, colors: ['#444', '#666', '#333'], up: -60, grow: 2 });
  const s = Math.floor(score);
  if (s > best) {
    best = s; newBest = true;
    try { localStorage.setItem('roadRacerBest', best); } catch (e) {}
  }
}

// ---------- Palette ----------
function palette() {
  const c = (traveled / CYCLE) % 1 * KF.length, i = Math.floor(c);
  let f = c - i;
  f = f < 0.55 ? 0 : (f - 0.55) / 0.45; // hold each time of day, then blend
  f = f * f * (3 - 2 * f);
  const a = KF[i], b = KF[(i + 1) % KF.length], p = {};
  for (const key in a) p[key] = Array.isArray(a[key]) ? mix(a[key], b[key], f) : lerp(a[key], b[key], f);
  return p;
}

// ---------- Rendering ----------
function project(p, camX, camY, camZ) {
  p.camera.x = -camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  const s = p.screen.scale = CAM_D / p.camera.z;
  p.screen.x = Math.round(W / 2 + s * p.camera.x * W / 2);
  p.screen.y = Math.round(H / 2 - s * p.camera.y * H / 2);
  p.screen.w = Math.round(s * ROAD_W * W / 2);
}

function pushLight(x, y, r, c, a, night = false) {
  a *= ctx.globalAlpha;
  r = Math.min(r, 160);
  if (a <= 0.01 || r < 1.5 || x < -r || x > W + r || y < -r || y > H + r) return;
  lights.push({ x, y, r, c, a, night });
}

function withClip(clipY, fn) {
  if (clipY >= H) return fn();
  ctx.save();
  ctx.beginPath(); ctx.rect(-50, -50, W + 100, clipY + 50); ctx.clip();
  fn();
  ctx.restore();
}

function drawBackground(pal) {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  g.addColorStop(0, rgb(pal.top)); g.addColorStop(1, rgb(pal.bottom));
  ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, H + 60);

  if (pal.stars > 0.02) {
    ctx.fillStyle = '#fff';
    for (const s of STARS) {
      ctx.globalAlpha = pal.stars * (0.55 + 0.45 * Math.sin(time * s.tw + s.ph));
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = pal.stars;
    ctx.fillStyle = '#f4f1de'; circle(W * 0.38, H * 0.13, 20);
    ctx.fillStyle = rgb(pal.top); circle(W * 0.38 + 9, H * 0.13 - 5, 17);
    ctx.globalAlpha = 1;
  }

  const sy = HORIZON - pal.sunY * (HORIZON - 30), sx = W * 0.7;
  if (sy < HORIZON + 40) {
    const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 150);
    sg.addColorStop(0, rgb(pal.sun, 0.55)); sg.addColorStop(1, rgb(pal.sun, 0));
    ctx.fillStyle = sg; ctx.fillRect(sx - 150, sy - 150, 300, 300);
    ctx.fillStyle = rgb(pal.sun); circle(sx, sy, 32);
  }

  ctx.fillStyle = rgb(pal.cloud, 0.85);
  for (const c of CLOUDS) {
    const span = W + 300, x = ((c.x - bgCloud) % span + span) % span - 150, s = c.s;
    ellipse(x, c.y, 42 * s, 14 * s); ellipse(x - 28 * s, c.y + 4 * s, 26 * s, 10 * s);
    ellipse(x + 30 * s, c.y + 4 * s, 30 * s, 11 * s); ellipse(x + 6 * s, c.y - 9 * s, 24 * s, 12 * s);
  }

  drawRange(FAR, bgFar, HORIZON + 6, pal.far, mix(pal.far, pal.fog, 0.35));
  drawRange(NEAR, bgNear, HORIZON + 8, pal.near, pal.near);
}

function drawRange(hts, off, baseY, color, topColor) {
  let peak = 0;
  for (let i = 0; i < hts.length; i += 16) peak = Math.max(peak, hts[i]);
  const g = ctx.createLinearGradient(0, baseY - peak, 0, baseY);
  g.addColorStop(0, rgb(topColor)); g.addColorStop(1, rgb(color));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-30, H + 30);
  for (let x = -30; x <= W + 30; x += 4) {
    const i = Math.floor(((x + off) % RANGE_P + RANGE_P) % RANGE_P);
    ctx.lineTo(x, baseY - hts[i]);
  }
  ctx.lineTo(W + 30, H + 30); ctx.fill();
}

function drawSegment(seg, pal) {
  const p1 = seg.p1.screen, p2 = seg.p2.screen, b = seg.biome, alt = seg.dark ? 1 : 0;
  ctx.fillStyle = b.grass[alt];
  ctx.fillRect(-30, p2.y, W + 60, p1.y - p2.y);
  const r1 = p1.w / 6, r2 = p2.w / 6, rc = alt ? '#d32f2f' : '#f5f5f5';
  quad(p1.x - p1.w - r1, p1.y, p1.x - p1.w, p1.y, p2.x - p2.w, p2.y, p2.x - p2.w - r2, p2.y, rc);
  quad(p1.x + p1.w + r1, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x + p2.w + r2, p2.y, rc);
  quad(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y, b.road[alt]);
  if (!alt) {
    const l1 = p1.w / 24, l2 = p2.w / 24, lw1 = p1.w * 2 / LANES, lw2 = p2.w * 2 / LANES;
    for (let l = 1; l < LANES; l++) {
      const x1 = p1.x - p1.w + lw1 * l, x2 = p2.x - p2.w + lw2 * l;
      quad(x1 - l1 / 2, p1.y, x1 + l1 / 2, p1.y, x2 + l2 / 2, p2.y, x2 - l2 / 2, p2.y, '#f2f2f2');
    }
  }
  if (seg.fog > 0.01) {
    ctx.globalAlpha = seg.fog; ctx.fillStyle = rgb(pal.fog);
    ctx.fillRect(-30, p2.y, W + 60, p1.y - p2.y);
    ctx.globalAlpha = 1;
  }
}

function drawWorld(pal) {
  const base = findSeg(position), basePct = (position % SEG) / SEG;
  const pSeg = findSeg(position + PLAYER_Z), pPct = ((position + PLAYER_Z) % SEG) / SEG;
  playerY = lerp(pSeg.p1.world.y, pSeg.p2.world.y, pPct);
  const camY = playerY + CAM_H, N = segments.length;
  let maxy = H, x = 0, dx = -(base.curve * basePct);

  for (let n = 0; n < DRAW_DIST; n++) {
    const seg = segments[(base.index + n) % N];
    const camZ = position - (seg.index < base.index ? trackLength : 0);
    const d = n / DRAW_DIST;
    seg.fog = 1 - Math.exp(-d * d * d * 5);
    seg.clip = maxy;
    project(seg.p1, playerX * ROAD_W - x, camY, camZ);
    project(seg.p2, playerX * ROAD_W - x - dx, camY, camZ);
    x += dx; dx += seg.curve;
    if (seg.p1.camera.z <= CAM_D || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    drawSegment(seg, pal);
    maxy = seg.p2.screen.y;
  }

  const bucket = new Map();
  const add = e => {
    const i = Math.floor(e.z / SEG) % N;
    if (!bucket.has(i)) bucket.set(i, []);
    bucket.get(i).push(e);
  };
  cars.forEach(add); items.forEach(add);

  // back to front: scenery, traffic, pickups, then the player at its own depth
  for (let n = DRAW_DIST - 1; n > 0; n--) {
    const seg = segments[(base.index + n) % N];
    const alpha = 1 - seg.fog;
    if (alpha > 0.02) {
      ctx.globalAlpha = alpha;
      withClip(seg.clip, () => {
        const p = seg.p1.screen;
        if (seg.p1.camera.z > 250) {
          for (const s of seg.sprites) {
            drawSprite(s, p.x + p.scale * s.offset * ROAD_W * W / 2, p.y, p.scale * W / 2);
          }
        }
        const ents = bucket.get(seg.index);
        if (ents) {
          ents.sort((a, b) => b.z - a.z);
          for (const e of ents) {
            const pct = (e.z % SEG) / SEG, a = seg.p1.screen, b = seg.p2.screen;
            const scale = lerp(a.scale, b.scale, pct), k = scale * W / 2;
            if (!(k > 0) || k > 2.5) continue;
            const ex = lerp(a.x, b.x, pct) + scale * e.offset * ROAD_W * W / 2, ey = lerp(a.y, b.y, pct);
            if (e.type) drawItem(ex, ey, k, e);
            else if (e.dead) {
              ctx.save();
              ctx.translate(ex, ey - e.lift * k); ctx.rotate(e.rot);
              drawVehicle(0, 0, k, e, false, false, 0);
              ctx.restore();
            } else drawVehicle(ex, ey, k, e);
          }
        }
      });
      ctx.globalAlpha = 1;
    }
    if (seg === pSeg) drawPlayer();
  }
}

// ---------- Vehicles ----------
function drawVehicle(x, y, k, v, isPlayer = false, braking = false, lightA = 1) {
  const w = v.w * k, h = v.h * k, L = x - w / 2;
  if (w < 1.5) return;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ellipse(x, y, w * 0.6, Math.max(1, w * 0.07));
  const tail = braking ? '#ff6b6b' : '#c81e1e';

  if (v.kind === 'truck') {
    ctx.fillStyle = '#141414';
    ctx.fillRect(L + w * 0.02, y - h * 0.14, w * 0.24, h * 0.14);
    ctx.fillRect(L + w * 0.74, y - h * 0.14, w * 0.24, h * 0.14);
    const g = ctx.createLinearGradient(0, y - h, 0, y - h * 0.14);
    g.addColorStop(0, v.light); g.addColorStop(1, v.dark);
    ctx.fillStyle = g; ctx.fillRect(L, y - h, w, h * 0.86);
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(L, y - h * 0.6, w, h * 0.07);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(x - w * 0.01, y - h * 0.97, Math.max(1, w * 0.02), h * 0.8);
    ctx.fillRect(L + w * 0.03, y - h * 0.97, w * 0.94, Math.max(1, h * 0.015));
    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(L + w * 0.05, y - h * 0.16, w * 0.9, h * 0.04);
    ctx.fillStyle = tail;
    ctx.fillRect(L + w * 0.03, y - h * 0.24, w * 0.1, h * 0.05);
    ctx.fillRect(L + w * 0.87, y - h * 0.24, w * 0.1, h * 0.05);
    pushLight(L + w * 0.08, y - h * 0.22, w * 0.2, '255,40,40', lightA * 0.6);
    pushLight(L + w * 0.92, y - h * 0.22, w * 0.2, '255,40,40', lightA * 0.6);
    return;
  }

  if (v.kind === 'van') {
    ctx.fillStyle = '#141414';
    ctx.fillRect(L + w * 0.06, y - h * 0.16, w * 0.17, h * 0.16);
    ctx.fillRect(L + w * 0.77, y - h * 0.16, w * 0.17, h * 0.16);
    const g = ctx.createLinearGradient(0, y - h, 0, y - h * 0.12);
    g.addColorStop(0, v.light); g.addColorStop(1, v.dark);
    ctx.fillStyle = g; rrect(L, y - h * 0.97, w, h * 0.85, w * 0.07);
    const gl = ctx.createLinearGradient(0, y - h * 0.88, 0, y - h * 0.58);
    gl.addColorStop(0, '#a9cbe6'); gl.addColorStop(1, '#2a3a50');
    ctx.fillStyle = gl;
    ctx.fillRect(L + w * 0.09, y - h * 0.88, w * 0.37, h * 0.3);
    ctx.fillRect(L + w * 0.54, y - h * 0.88, w * 0.37, h * 0.3);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - Math.max(0.5, w * 0.005), y - h * 0.92, Math.max(1, w * 0.01), h * 0.7);
    ctx.fillStyle = tail;
    ctx.fillRect(L + w * 0.02, y - h * 0.55, w * 0.06, h * 0.22);
    ctx.fillRect(L + w * 0.92, y - h * 0.55, w * 0.06, h * 0.22);
    ctx.fillStyle = '#1d1d1d'; ctx.fillRect(L + w * 0.01, y - h * 0.2, w * 0.98, h * 0.07);
    ctx.fillStyle = '#f1f1f1'; ctx.fillRect(x - w * 0.1, y - h * 0.32, w * 0.2, h * 0.08);
    pushLight(L + w * 0.05, y - h * 0.44, w * 0.22, '255,40,40', lightA * 0.6);
    pushLight(L + w * 0.95, y - h * 0.44, w * 0.22, '255,40,40', lightA * 0.6);
    return;
  }

  // sedan / player sports car
  const wh = h * 0.24;
  ctx.fillStyle = '#141414';
  ctx.fillRect(L + w * 0.05, y - wh, w * 0.18, wh);
  ctx.fillRect(L + w * 0.77, y - wh, w * 0.18, wh);
  const bodyTop = y - h * 0.62, bodyBot = y - h * 0.12;
  const cab = isPlayer ? 0.9 : 1;
  ctx.fillStyle = v.dark;
  ctx.beginPath();
  ctx.moveTo(L + w * 0.1, bodyTop + 1); ctx.lineTo(L + w * 0.22, y - h * cab);
  ctx.lineTo(L + w * 0.78, y - h * cab); ctx.lineTo(L + w * 0.9, bodyTop + 1);
  ctx.closePath(); ctx.fill();
  const gl = ctx.createLinearGradient(0, y - h * cab, 0, bodyTop);
  gl.addColorStop(0, '#a9cbe6'); gl.addColorStop(1, '#23324a');
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.moveTo(L + w * 0.17, bodyTop - h * 0.02); ctx.lineTo(L + w * 0.26, y - h * (cab - 0.07));
  ctx.lineTo(L + w * 0.74, y - h * (cab - 0.07)); ctx.lineTo(L + w * 0.83, bodyTop - h * 0.02);
  ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0, bodyTop, 0, bodyBot);
  g.addColorStop(0, v.light); g.addColorStop(0.5, v.color); g.addColorStop(1, v.dark);
  ctx.fillStyle = g; rrect(L, bodyTop, w, bodyBot - bodyTop, h * 0.1);
  if (isPlayer) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillRect(x - w * 0.09, bodyTop, w * 0.05, bodyBot - bodyTop);
    ctx.fillRect(x + w * 0.04, bodyTop, w * 0.05, bodyBot - bodyTop);
  }
  ctx.fillStyle = tail;
  ctx.fillRect(L + w * 0.04, bodyTop + h * 0.1, w * 0.2, h * 0.1);
  ctx.fillRect(L + w * 0.76, bodyTop + h * 0.1, w * 0.2, h * 0.1);
  ctx.fillStyle = '#1d1d1d'; ctx.fillRect(L + w * 0.02, bodyBot - h * 0.1, w * 0.96, h * 0.1);
  ctx.fillStyle = '#f1f1f1'; ctx.fillRect(x - w * 0.1, bodyTop + h * 0.22, w * 0.2, h * 0.11);
  const la = braking ? 1 : 0.6, lr = w * (braking ? 0.35 : 0.25);
  pushLight(L + w * 0.14, bodyTop + h * 0.15, lr, '255,40,40', lightA * la);
  pushLight(L + w * 0.86, bodyTop + h * 0.15, lr, '255,40,40', lightA * la);

  if (isPlayer) {
    // spoiler
    ctx.fillStyle = '#222';
    ctx.fillRect(L + w * 0.2, y - h * 1.02, w * 0.04, h * 0.14);
    ctx.fillRect(L + w * 0.76, y - h * 1.02, w * 0.04, h * 0.14);
    ctx.fillStyle = v.dark; rrect(L - w * 0.02, y - h * 1.1, w * 1.04, h * 0.1, h * 0.04);
    // twin exhausts
    ctx.fillStyle = '#777'; ellipse(x - w * 0.22, y - h * 0.14, w * 0.04, h * 0.045); ellipse(x + w * 0.22, y - h * 0.14, w * 0.04, h * 0.045);
    ctx.fillStyle = '#111'; ellipse(x - w * 0.22, y - h * 0.14, w * 0.025, h * 0.028); ellipse(x + w * 0.22, y - h * 0.14, w * 0.025, h * 0.028);
  }
}

function drawPlayer() {
  const bounce = state === 'playing'
    ? Math.sin(time * 30) * (speed / MAX_SPEED) * 1.2 + (Math.abs(playerX) > 1 ? rand(-2, 2) : 0) : 0;
  const x = W / 2, y = H - 14 + bounce;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(tilt * 0.05); ctx.translate(-x, -y);
  drawVehicle(x, y, PK, PLAYER, true, state === 'playing' && input.down);
  if (nitro > 0) {
    for (const side of [-1, 1]) {
      const fx = x + side * PW * 0.22, fy = y - PH * 0.14, len = rand(26, 48);
      const g = ctx.createLinearGradient(fx, fy, fx, fy + len);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#6ec6ff'); g.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = g; ellipse(fx, fy + len / 2, 7, len / 2);
    }
  }
  if (shield > 0 && (shield > 1.5 || Math.sin(time * 30) > 0)) {
    const pulse = 1 + Math.sin(time * 8) * 0.03;
    ctx.fillStyle = 'rgba(80,200,255,.14)'; ctx.strokeStyle = 'rgba(120,220,255,.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, y - PH * 0.55, PW * 0.68 * pulse, PH * 0.85 * pulse, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Scenery sprites ----------
function drawSprite(s, x, y, k) {
  const def = SPRITES[s.type], w = def.w * k, h = def.h * k;
  if (h < 1.5 || x + w < -50 || x - w > W + 50) return;
  switch (s.type) {
    case 'pine': case 'snowpine': {
      const snowy = s.type === 'snowpine';
      ctx.fillStyle = '#5d4037'; ctx.fillRect(x - w * 0.06, y - h * 0.18, w * 0.12, h * 0.18);
      const cols = snowy ? ['#1f4d44', '#2a5e52', '#356d60'] : ['#1b5e20', '#2e7d32', '#388e3c'];
      for (let i = 0; i < 3; i++) {
        const by = y - h * (0.12 + i * 0.26), ty = by - h * 0.42, hw = w * (0.5 - i * 0.1);
        quad(x - hw, by, x, ty, x, ty, x + hw, by, cols[i]);
        if (snowy) quad(x - hw * 0.4, ty + (by - ty) * 0.4, x, ty, x, ty, x + hw * 0.4, ty + (by - ty) * 0.4, '#f5f9fc');
      }
      break;
    }
    case 'oak':
      ctx.fillStyle = '#6d4c41'; ctx.fillRect(x - w * 0.06, y - h * 0.45, w * 0.12, h * 0.45);
      ctx.fillStyle = '#2e7d32';
      circle(x, y - h * 0.62, w * 0.32); circle(x - w * 0.24, y - h * 0.5, w * 0.24);
      circle(x + w * 0.24, y - h * 0.5, w * 0.24); circle(x, y - h * 0.8, w * 0.24);
      ctx.fillStyle = '#43a047'; circle(x - w * 0.08, y - h * 0.72, w * 0.16);
      break;
    case 'bush':
      ctx.fillStyle = '#2e7d32';
      circle(x - w * 0.25, y - h * 0.4, w * 0.25); circle(x + w * 0.22, y - h * 0.4, w * 0.25);
      ctx.fillStyle = '#388e3c'; circle(x, y - h * 0.55, w * 0.3);
      break;
    case 'palm': {
      const tx = x + w * 0.1, ty = y - h * 0.85;
      ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = Math.max(1, w * 0.07);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + w * 0.25, y - h * 0.5, tx, ty); ctx.stroke();
      ctx.fillStyle = '#2e7d32';
      for (const a of [-3.0, -2.5, -2.0, -1.1, -0.6, -0.1]) {
        ctx.save(); ctx.translate(tx, ty); ctx.rotate(a);
        ellipse(w * 0.26, w * 0.03, w * 0.28, w * 0.06);
        ctx.restore();
      }
      ctx.fillStyle = '#5d4037'; circle(tx - w * 0.03, ty + w * 0.04, w * 0.04); circle(tx + w * 0.04, ty + w * 0.05, w * 0.04);
      break;
    }
    case 'cactus':
      ctx.fillStyle = '#2e7d32';
      rrect(x - w * 0.12, y - h, w * 0.24, h, w * 0.12);
      rrect(x - w * 0.42, y - h * 0.65, w * 0.15, h * 0.3, w * 0.07);
      rrect(x - w * 0.42, y - h * 0.42, w * 0.34, w * 0.14, w * 0.07);
      rrect(x + w * 0.27, y - h * 0.8, w * 0.15, h * 0.32, w * 0.07);
      rrect(x + w * 0.08, y - h * 0.55, w * 0.34, w * 0.14, w * 0.07);
      ctx.fillStyle = '#43a047'; ctx.fillRect(x - w * 0.04, y - h * 0.9, Math.max(1, w * 0.04), h * 0.85);
      break;
    case 'rock':
      ctx.fillStyle = '#8d8d8d';
      ctx.beginPath(); ctx.moveTo(x - w * 0.5, y); ctx.lineTo(x - w * 0.4, y - h * 0.6); ctx.lineTo(x - w * 0.1, y - h);
      ctx.lineTo(x + w * 0.3, y - h * 0.8); ctx.lineTo(x + w * 0.5, y); ctx.closePath(); ctx.fill();
      quad(x - w * 0.1, y - h, x + w * 0.3, y - h * 0.8, x + w * 0.5, y, x + w * 0.05, y, '#6f6f6f');
      break;
    case 'snowman':
      ctx.fillStyle = '#fafafa';
      circle(x, y - w * 0.45, w * 0.45); circle(x, y - w * 1.15, w * 0.32); circle(x, y - w * 1.6, w * 0.22);
      ctx.fillStyle = '#222';
      ctx.fillRect(x - w * 0.2, y - w * 1.8, w * 0.4, w * 0.05); ctx.fillRect(x - w * 0.13, y - w * 2.02, w * 0.26, w * 0.22);
      ctx.fillStyle = '#ff7043'; quad(x, y - w * 1.62, x + w * 0.22, y - w * 1.58, x + w * 0.22, y - w * 1.58, x, y - w * 1.55, '#ff7043');
      break;
    case 'lamp': {
      const dir = s.side, hx = x + dir * h * 0.25, hy = y - h + w * 0.25;
      ctx.fillStyle = '#37474f';
      ctx.fillRect(x - w * 0.15, y - h, w * 0.3, h);
      ctx.fillRect(Math.min(x, hx), y - h, Math.abs(hx - x), w * 0.2);
      ctx.fillStyle = '#fff8e1'; ellipse(hx, hy, w * 0.6, w * 0.18);
      pushLight(hx, hy, h * 0.3, '255,214,140', 0.9, true);
      break;
    }
    case 'billboard': {
      ctx.fillStyle = '#555';
      ctx.fillRect(x - w * 0.32, y - h * 0.55, w * 0.05, h * 0.55);
      ctx.fillRect(x + w * 0.27, y - h * 0.55, w * 0.05, h * 0.55);
      ctx.fillStyle = s.color; rrect(x - w / 2, y - h, w, h * 0.5, w * 0.03);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, w * 0.015); ctx.stroke();
      if (w > 40) {
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `bold italic ${Math.round(h * 0.17)}px system-ui, sans-serif`;
        ctx.fillText(s.text, x, y - h * 0.75, w * 0.9);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }
      break;
    }
  }
}

// ---------- Pickups ----------
function drawCoin(x, y, r, spin) {
  const sx = Math.max(0.12, Math.abs(Math.cos(spin)));
  ctx.fillStyle = '#b8860b'; ellipse(x, y, r * sx, r);
  ctx.fillStyle = '#ffd54f'; ellipse(x, y, r * sx * 0.78, r * 0.78);
  ctx.fillStyle = '#fff3c4'; ellipse(x - r * sx * 0.25, y - r * 0.3, r * sx * 0.18, r * 0.22);
}

function drawBadge(type, x, y, r) {
  const P = POWER[type];
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, P.col); g.addColorStop(1, P.deep);
  ctx.fillStyle = g; circle(x, y, r);
  ctx.lineWidth = Math.max(1, r * 0.12); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  if (type === 'nitro') {
    const pts = [[0.15, -0.68], [-0.35, 0.1], [-0.02, 0.1], [-0.15, 0.68], [0.35, -0.1], [0.02, -0.1]];
    pts.forEach(([px, py], i) => i ? ctx.lineTo(x + px * r, y + py * r) : ctx.moveTo(x + px * r, y + py * r));
    ctx.closePath(); ctx.fill();
  } else if (type === 'shield') {
    ctx.moveTo(x, y - r * 0.6); ctx.lineTo(x + r * 0.48, y - r * 0.4); ctx.lineTo(x + r * 0.44, y + r * 0.08);
    ctx.quadraticCurveTo(x + r * 0.3, y + r * 0.48, x, y + r * 0.62);
    ctx.quadraticCurveTo(x - r * 0.3, y + r * 0.48, x - r * 0.44, y + r * 0.08);
    ctx.lineTo(x - r * 0.48, y - r * 0.4); ctx.closePath(); ctx.fill();
  } else {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(r * 0.95)}px system-ui, sans-serif`;
    ctx.fillText('×2', x, y + r * 0.04);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

function drawItem(x, y, k, it) {
  const bob = Math.sin(time * 4 + it.z * 0.01) * 40;
  const r = (it.type === 'coin' ? 110 : 150) * k;
  if (r < 1) return;
  const cy = y - (280 + bob) * k;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ellipse(x, y, r * 0.9, r * 0.25);
  if (it.type === 'coin') {
    drawCoin(x, cy, r, time * 4 + it.z * 0.002);
    pushLight(x, cy, r * 2.2, '255,210,80', 0.35);
    return;
  }
  const P = POWER[it.type];
  const bh = 1100 * k, bg = ctx.createLinearGradient(0, cy - bh, 0, cy);
  bg.addColorStop(0, `rgba(${P.glow},0)`); bg.addColorStop(1, `rgba(${P.glow},.4)`);
  ctx.fillStyle = bg; ctx.fillRect(x - r * 0.6, cy - bh, r * 1.2, bh);
  drawBadge(it.type, x, cy, r);
  pushLight(x, cy, r * 3, P.glow, 0.6);
}

// ---------- Lights, effects, HUD ----------
function drawLights(pal) {
  ctx.globalCompositeOperation = 'lighter';
  if (pal.dark > 0.05) { // headlight beams
    const topY = HORIZON + 30, baseY = H - 14 - PH * 1.1;
    const g = ctx.createLinearGradient(0, baseY, 0, topY);
    g.addColorStop(0, `rgba(255,244,214,${pal.dark * 0.55})`); g.addColorStop(1, 'rgba(255,244,214,0)');
    quad(W / 2 - PW * 0.3, baseY, W / 2 + PW * 0.3, baseY, W / 2 + 280, topY, W / 2 - 280, topY, g);
  }
  for (const l of lights) {
    const a = Math.min(1, l.night ? l.a * pal.dark * 1.6 : l.a * (0.25 + pal.dark));
    if (a < 0.01) continue;
    const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    g.addColorStop(0, `rgba(${l.c},${a})`); g.addColorStop(1, `rgba(${l.c},0)`);
    ctx.fillStyle = g; ctx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSpeedLines() {
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, r0 = rand(150, 260), r1 = r0 + rand(60, 170);
    ctx.moveTo(W / 2 + Math.cos(a) * r0 * 1.6, HORIZON + Math.sin(a) * r0);
    ctx.lineTo(W / 2 + Math.cos(a) * r1 * 1.6, HORIZON + Math.sin(a) * r1);
  }
  ctx.stroke();
}

function drawParticles() {
  for (const p of particles) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.max(0, t);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.fillStyle = p.color;
    circle(p.x, p.y, p.size * (1 + (1 - t) * p.grow));
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function panel(x, y, w, h) { ctx.fillStyle = 'rgba(10,14,22,.62)'; rrect(x, y, w, h, 10); }

function drawHUD() {
  ctx.textBaseline = 'alphabetic';
  panel(12, 12, 184, 58);
  ctx.textAlign = 'left'; ctx.fillStyle = '#9fb0c8'; ctx.font = '600 11px system-ui, sans-serif';
  ctx.fillText('SCORE', 24, 30);
  ctx.textAlign = 'right'; ctx.fillText('BEST ' + best.toLocaleString(), 184, 30);
  ctx.textAlign = 'left'; ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.fillStyle = double > 0 ? '#d7a6ff' : '#fff';
  ctx.fillText(Math.floor(score).toLocaleString(), 24, 58);
  if (double > 0) { ctx.font = 'bold 13px system-ui, sans-serif'; ctx.fillStyle = '#d7a6ff'; ctx.fillText('×2', 160, 57); }

  let y = 78;
  for (const [type, t] of [['nitro', nitro], ['shield', shield], ['double', double]]) {
    if (t <= 0) continue;
    panel(12, y, 184, 28);
    drawBadge(type, 28, y + 14, 9);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(POWER[type].label, 44, y + 18);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; rrect(112, y + 11, 74, 6, 3);
    ctx.fillStyle = POWER[type].col; rrect(112, y + 11, 74 * t / POW_TIME[type], 6, 3);
    y += 34;
  }

  // speedometer
  const cx = W - 78, cy = H - 70, R = 48, a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  const mph = speed / MAX_SPEED * 160, frac = clamp(mph / 240, 0, 1);
  ctx.fillStyle = 'rgba(10,14,22,.62)'; circle(cx, cy, R + 12);
  ctx.lineCap = 'round'; ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,82,82,.55)'; ctx.beginPath(); ctx.arc(cx, cy, R, a0 + (a1 - a0) * (160 / 240), a1); ctx.stroke();
  ctx.strokeStyle = nitro > 0 ? '#ff8a1f' : '#4fc3f7';
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + (a1 - a0) * Math.max(0.001, frac)); ctx.stroke();
  const na = a0 + (a1 - a0) * frac;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(na) * (R - 12), cy + Math.sin(na) * (R - 12)); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#fff'; circle(cx, cy, 4);
  ctx.textAlign = 'center'; ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillText(Math.round(mph), cx, cy + 30);
  ctx.fillStyle = '#9fb0c8'; ctx.font = '600 10px system-ui, sans-serif'; ctx.fillText('MPH', cx, cy + 42);
  ctx.textAlign = 'left';
}

function drawPopups() {
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = `bold italic ${p.size}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawOverlay() {
  ctx.fillStyle = 'rgba(5,8,15,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const title = state === 'over' ? 'CRASH!' : 'ROAD RACER';
  ctx.font = 'bold italic 60px system-ui, sans-serif';
  const g = ctx.createLinearGradient(0, H / 2 - 150, 0, H / 2 - 90);
  if (state === 'over') { g.addColorStop(0, '#ffab91'); g.addColorStop(1, '#e53935'); }
  else { g.addColorStop(0, '#ffe082'); g.addColorStop(1, '#ff5722'); }
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.strokeText(title, W / 2, H / 2 - 95);
  ctx.fillStyle = g; ctx.fillText(title, W / 2, H / 2 - 95);
  ctx.fillStyle = '#fff'; ctx.font = '18px system-ui, sans-serif';
  if (state === 'over') {
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillText('Score: ' + Math.floor(score).toLocaleString(), W / 2, H / 2 - 40);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = newBest ? '#ffd54f' : '#cfd8e3';
    ctx.fillText(newBest ? '★ NEW BEST! ★' : 'Best: ' + best.toLocaleString(), W / 2, H / 2 - 10);
  } else {
    ctx.fillText('Weave through traffic, grab power-ups, go as far as you can.', W / 2, H / 2 - 50);
    const items = [['nitro', 'Nitro boost'], ['shield', 'Smash shield'], ['double', 'Double points']];
    items.forEach(([t, label], i) => {
      const x = W / 2 - 200 + i * 200;
      drawBadge(t, x, H / 2 + 5, 18);
      ctx.fillStyle = '#fff'; ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, x, H / 2 + 45);
    });
  }
  if (Math.sin(time * 5) > -0.3) {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillText('Press Space to ' + (state === 'over' ? 'race again' : 'start'), W / 2, H / 2 + 100);
  }
  ctx.textAlign = 'left';
}

function render() {
  const pal = palette();
  lights.length = 0;
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawBackground(pal);
  drawWorld(pal);
  if (pal.dark > 0.01) { ctx.fillStyle = `rgba(8,12,35,${pal.dark})`; ctx.fillRect(-30, -30, W + 60, H + 60); }
  drawLights(pal);
  if (nitro > 0) drawSpeedLines();
  drawParticles();
  ctx.restore();
  ctx.fillStyle = VIGNETTE; ctx.fillRect(0, 0, W, H);
  drawPopups();
  if (state === 'playing') drawHUD();
  else drawOverlay();
}

// ---------- Input ----------
const KEYMAP = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right',
  arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYMAP[k] || k === ' ') e.preventDefault();
  if (KEYMAP[k]) input[KEYMAP[k]] = true;
  if (k === ' ' && state !== 'playing') start();
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key.toLowerCase()];
  if (k) input[k] = false;
});
// Touch / mouse: hold to drive, hold left or right third of the screen to steer
function pointerSteer(e) {
  const r = canvas.getBoundingClientRect(), side = (e.clientX - r.left) / r.width;
  input.up = true; input.left = side < 0.35; input.right = side > 0.65;
}
canvas.addEventListener('pointerdown', e => {
  if (state !== 'playing') { start(); return; }
  canvas.setPointerCapture(e.pointerId);
  pointerSteer(e);
});
canvas.addEventListener('pointermove', e => { if (e.buttons && state === 'playing') pointerSteer(e); });
const pointerStop = () => { input.up = input.left = input.right = false; };
canvas.addEventListener('pointerup', pointerStop);
canvas.addEventListener('pointercancel', pointerStop);

// ---------- Main loop ----------
buildTrack();
reset();
let last = performance.now();
function showError(err) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#300'; ctx.fillRect(0, H - 60, W, 60);
  ctx.fillStyle = '#fff'; ctx.font = '14px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Error: ' + (err && err.message || err), 12, H - 26, W - 24);
}
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  try {
    update(dt);
    render();
  } catch (err) {
    console.error(err);
    showError(err);
  }
  requestAnimationFrame(frame);
}
// Draw the first frame right away so the screen is never left blank
frame(performance.now());
</script>
</body>
</html>
